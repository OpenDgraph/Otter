balancer_type: defined
proxy_port: 8084
websocket_port: 8089
dgraph_user: ""
dgraph_password: ""
enable_http: true
enable_websocket: true
graphql: true
ratel-graphql: true
ratel: dgraph-ratel:8000
max_body_bytes: 1048576
ws_max_message_bytes: 1048576

# --- Dev-only safety defaults ---------------------------------------------
# dev_mode=true lets Otter auto-generate a WS token if unset and keeps the
# WebSocket CheckOrigin permissive. Flip to `false` (and set ws_token plus
# ws_allowed_origins) for any exposed deployment.
dev_mode: true
# Pinned so E2E tests are reproducible. Never ship this value beyond dev.
ws_token: "banana"
dgraph_endpoints: # Needed if using simple round-robin balancing
  - dgraph-alpha1:9081
  - dgraph-alpha2:9082
groups:
  query:
    - dgraph-alpha1:9081
    - dgraph-alpha2:9082
  mutation:
    - dgraph-alpha3:9083
  upsert:
    - dgraph-alpha3:9083
    - dgraph-alpha2:9082
